<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书列表展示</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <link rel="stylesheet" href="css/list.css">
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.min.js"></script>
    <script src="js/jq-paginator.js"></script>

</head>

<body>
    <div class="bookContainer">
        <h2>图书列表展示</h2>
        <div class="navbar-justify-between">
            <div>
                <button class="btn btn-outline-info" type="button" onclick="location.href='book_add.html'">添加图书</button>
                <button class="btn btn-outline-info" type="button" onclick="batchDelete()">批量删除</button>
            </div>
            <div>
        <input type="text" id="searchBookName" class="form-control"
               placeholder="请输入书名" style="display: inline-block; width: 220px;">
        <button class="btn btn-outline-info" type="button" onclick="searchBook()">搜索</button>
    </div>
        </div>

        <table>
            <thead>
                <tr>
                    <td>选择</td>
                    <td class="width100">图书ID</td>
                    <td>书名</td>
                    <td>作者</td>
                    <td>数量</td>
                    <td>定价</td>
                    <td>出版社</td>
                    <td>状态</td>
                    <td class="width200">操作</td>
                </tr>
            </thead>
            <tbody>
               
            </tbody>
        </table>

        <div class="demo">
            <ul id="pageContainer" class="pagination justify-content-center"></ul>
        </div>


<script>
    // ============ 解析 URL 参数 ============
    const searchParam = new URLSearchParams(location.search);
    let currentPage = parseInt(searchParam.get("currentPage"));
    if (isNaN(currentPage) || currentPage < 1) {
        currentPage = 1;
    }
    let bookName = searchParam.get("bookName") || "";
    // 回填搜索框
    $("#searchBookName").val(bookName);

    getBookList(currentPage, bookName);

    // ============ 搜索 ============
    function searchBook() {
        const name = $("#searchBookName").val().trim();
        // 搜索后回到第 1 页
        location.href = "book_list.html?currentPage=1" + (name ? "&bookName=" + encodeURIComponent(name) : "");
    }

    // ============ 图书列表 ============
    function getBookList(currentPage, bookName) {
        // 拼接 URL 时 bookName 要做 URL 编码，中文必须编码否则会乱码
        let url = "/book/getListByPage?currentPage=" + currentPage;
        if (bookName) {
            url += "&bookName=" + encodeURIComponent(bookName);
        }
        $.ajax({
            type: "get",
            url: url,
            success: function (result) {
                console.log(result);

                if (result == null || result.data == null) {
                    location.href = "login.html";
                    return;
                }

                var data = result.data;
                var finalHtml = "";
                for (var book of data.records) {
                    finalHtml += '<tr>';
                    finalHtml += '<td><input type="checkbox" name="selectBook" value="' + book.id + '" id="selectBook" class="book-select"></td>';
                    finalHtml += '<td>' + book.id + '</td>';
                    finalHtml += '<td>' + book.bookName + '</td>';
                    finalHtml += '<td>' + book.author + '</td>';
                    finalHtml += '<td>' + book.count + '</td>';
                    finalHtml += '<td>' + book.price + '</td>';
                    finalHtml += '<td>' + book.publish + '</td>';
                    finalHtml += '<td>' + book.statusCN + '</td>';
                    finalHtml += '<td><div class="op">';
                    finalHtml += '<a href="book_update.html?bookId=' + book.id + '">修改</a>';
                    finalHtml += '<a href="javascript:void(0)" onclick="deleteBook(' + book.id + ')">删除</a>';
                    finalHtml += '</div></td></tr>';
                }
                $("tbody").html(finalHtml);

                // ============ 分页（必须在数据加载完之后）============
                $("#pageContainer").jqPaginator({
                    totalCounts: data.total,
                    pageSize: data.pageRequest.pageSize,
                    visiblePages: 5,
                    currentPage: data.pageRequest.currentPage,
                    first: '<li class="page-item"><a class="page-link">首页</a></li>',
                    prev: '<li class="page-item"><a class="page-link" href="javascript:void(0);">上一页</a></li>',
                    next: '<li class="page-item"><a class="page-link" href="javascript:void(0);">下一页</a></li>',
                    last: '<li class="page-item"><a class="page-link" href="javascript:void(0);">最后一页</a></li>',
                    page: '<li class="page-item"><a class="page-link">{{page}}</a></li>',
                    onPageChange: function (page, type) {
                        if (type != 'init') {
                            // 翻页时要把搜索条件一起带上，否则翻页会丢失搜索结果
                            location.href = "book_list.html?currentPage=" + page
                                + (bookName ? "&bookName=" + encodeURIComponent(bookName) : "");
                        }
                    }
                });
            },
            error: function (error) {
                console.log(error);
            }
        });
    }

    // ============ 删除 ============
    function deleteBook(id) {
        var isDelete = confirm("确认删除?");
        if (isDelete) {
            $.ajax({
                type: "post",
                url: "/book/updateBook",
                data: { id: id, status: 0 },
                success: function (result) {
                    if (result == "") {
                        location.href = "book_list.html";
                    } else {
                        alert("删除失败:" + result);
                    }
                },
                error: function (error) {
                    console.log(error);
                }
            });
        }
    }

    // ============ 批量删除 ============
    function batchDelete() {
        var isDelete = confirm("确认批量删除?");
        if (isDelete) {
            var ids = [];
            $("input:checkbox[name='selectBook']:checked").each(function () {
                ids.push($(this).val());
            });
            if (ids.length === 0) {
                alert("请先选择要删除的图书");
                return;
            }
            $.ajax({
                type: "post",
                url: "/book/batchDeleteBook?ids=" + ids,
                success: function (result) {
                    if (result) {
                        alert("删除成功");
                        location.href = "book_list.html";
                    } else {
                        alert("删除失败");
                    }
                },
                error: function (error) {
                    console.log(error);
                }
            });
        }
    }
</script>
    </div>
</body>

</html>
